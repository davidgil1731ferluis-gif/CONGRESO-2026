name: Publicar EventFlow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar comportamiento
        run: node --test tests/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Descargar emulador oficial de Firestore
        run: |
          curl --fail --location --silent --output "$RUNNER_TEMP/firestore.jar" https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.22.0.jar
          echo "9b6498b7f62714d67f48f59b3818883cd682dbcd46b9f59511de81c97bb5166c  $RUNNER_TEMP/firestore.jar" | sha256sum --check --status
      - name: Verificar reglas reales sin proyecto ni facturación
        env:
          FIRESTORE_EMULATOR_JAR: ${{ runner.temp }}/firestore.jar
        run: node tests/run-firestore-emulator.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
